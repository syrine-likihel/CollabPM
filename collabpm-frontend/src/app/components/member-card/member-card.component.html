<div class="member-card">

  <div
    class="member-avatar"
    [style.background]="getAvatarColor()"
  >
    {{ getInitials() }}
  </div>

  <div class="member-info">

    <h3>
      {{ member?.userName || 'Unknown user' }}
    </h3>

    <p>
      {{ member?.userEmail || 'No email' }}
    </p>

    <span class="member-role">
      {{ member?.roleInProject || 'Member' }}
    </span>

  </div>

  @if (showRemove) {
  <button
    type="button"
    class="btn-remove"
    (click)="remove()"
  >
    Remove
  </button>
}

</div>
